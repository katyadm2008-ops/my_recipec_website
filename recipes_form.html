	</head>
	<body>
	<header>
    <a href="recipes_main.html"><img src="logo.png" alt="Логотип"></a>
    <nav>
        <div id="dropdown" class="dropdown">
            <span class="line"></span>
            <span class="line"></span>
            <span class="line"></span>
            <div id="dropdowncontent" class="dropdown-content">
                <ul>
                    <li><a href="recipes_main.html">Главная</a></li>
                    <li><a href="recipes_text.html">Рецепты</a></li>
                    <li><a href="recipes_form.html">Написать отзыв</a></li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<section class="form-section">
    <div class="form-container">
        <h2>Поделитесь впечатлениями ✍️</h2>
        <p class="form-subtitle">Ваш отзыв поможет сделать наши рецепты еще вкуснее!</p>
        
        <form action="#" method="POST">
            <div class="form-group">
                <label for="username">Ваше имя</label>
                <input type="text" id="username" name="username" placeholder="Иван Иванов" required>
            </div>

            <div class="form-group">
                <label for="dish">Какое блюдо готовили?</label>
                <select id="dish" name="dish">
                    <option value="tiramisu">Тирамису</option>
                    <option value="carbonara">Карбонара</option>
                    <option value="lasagna">Лазанья</option>
                    <option value="venzeli">Вензели</option>
                </select>
            </div>

            <div class="form-group">
                <label for="review">Ваш отзыв</label>
                <textarea id="review" name="review" rows="5" placeholder="Понравился ли вам рецепт? Все ли получилось?" required></textarea>
            </div>

            <button type="submit" class="submit-btn">Отправить отзыв</button>
        </form>
    </div>
</section>

<footer>
    <p>@recipes, 2026</p>
    <a href="https://vk.com" target="_blank">VK</a>
</footer>
